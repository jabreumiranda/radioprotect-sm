[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "radioprotect-sm"
version = "0.1.0"
description = "Reproducible small-molecule multitask models for radioprotectant hit prioritization (ChEMBL proxies)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Julio / radioprotect-sm contributors" }]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scikit-learn>=1.4,<2",
  "scipy>=1.11,<2",
  "rdkit>=2023.9.1",
  "PyYAML>=6.0,<7",
  "requests>=2.31,<3",
  "tqdm>=4.66,<5",
  "joblib>=1.3,<2",
  "click>=8.1,<9",
  "chembl-webresource-client>=0.10.9",
]

[project.optional-dependencies]
chemprop = [
  "torch>=2.1,<3",
  "chemprop>=2.1,<3",
]
dev = [
  "pytest>=8.0,<9",
  "pytest-cov>=5.0,<6",
]

[project.scripts]
radioprotect-sm = "radioprotect_sm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
